# 一次性：把 OVH 在跑的旧镜像种成新命名空间的升级基线（sha-<commit>）。
# 背景：新 GHCR 命名空间下还没有任何历史 tag，真升级用例解析不到基线会红；
#   把旧镜像推成 sha-d0e44aa… 后，构建的动态解析就能找到它（或配合
#   vars.UPGRADE_FROM_TAG 使用）。
# 用法：Actions 页手动 Run → 跑完去把 lsky-pro-docker 包改公开 → 重跑构建。
# 用完即删，不要留。
name: Seed baseline image (one-time)

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  IMAGE: ghcr.io/bigyvc/lsky-pro-docker
  # 取自 OVH 旧镜像的 org.opencontainers.image.revision（即 OVH 在跑的那一版）
  BASELINE_TAG: sha-d0e44aa20b2a8967ced9f19245ed7eb37811b6c7
  SOURCE: ghcr.io/mole404/lsky-pro-docker:latest

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Retag old image as baseline and push
        run: |
          set -euo pipefail
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$IMAGE:$BASELINE_TAG"
          docker push "$IMAGE:$BASELINE_TAG"
          docker logout ghcr.io
