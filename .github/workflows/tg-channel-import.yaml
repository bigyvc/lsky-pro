name: Test optional Telegram channel importer
on:
  push:
    branches: [master, test/tg-channel-import]
    paths:
      - 'tools/tg-channel-import/**'
      - 'test/tg-channel-import.test.py'
      - 'test/tg-channel-history.test.py'
      - '.github/workflows/tg-channel-import.yaml'
  pull_request:
    paths:
      - 'tools/tg-channel-import/**'
      - 'test/tg-channel-import.test.py'
      - 'test/tg-channel-history.test.py'
      - '.github/workflows/tg-channel-import.yaml'
permissions:
  contents: read
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: State and API behavior regressions
        run: |
          python3 test/tg-channel-import.test.py
          python3 test/tg-channel-history.test.py
      - name: Build independent collector image
        run: docker build -t lsky-channel-import:ci tools/tg-channel-import
      - name: CLI and offline state smoke test
        run: |
          docker run --rm lsky-channel-import:ci --help
          docker run --rm --network none --read-only --tmpfs /state:uid=10001,gid=10001,mode=0700 lsky-channel-import:ci status
